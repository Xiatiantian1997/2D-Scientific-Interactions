name: Validate 2D interactions
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python3 scripts/build_catalog.py
      - run: node tests/check-additions.cjs && node tests/check-controls.cjs && python3 -m unittest discover -s tests
      - run: node tests/browser-check.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-evidence
          path: evidence/

