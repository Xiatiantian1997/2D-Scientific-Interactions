<section class="sci-extra" data-sci-example="quantum-linked">
<style>
.sci-extra{overflow-anchor:none;color:var(--foreground)}.sci-extra svg{display:block;width:100%;overflow:visible}.sci-extra[data-sci-example="sampling-distribution"] svg{height:310px}.sci-extra[data-sci-example="quantum-linked"] svg{height:410px}.sci-extra [data-reading]{min-height:3em;margin:8px 0}.sci-extra [data-latest]{min-height:1.5em}.sci-extra input{width:100%}</style>
<h3>同一量子态 · 概率密度与能级</h3>
<svg role="img" aria-label="上图是位置概率密度，下图是允许能级；同一所选定态以实线强调。"></svg>
<div data-readouts class="sci-readouts"><div data-reading></div><output data-value></output></div><div data-controls><input type="range" class="form-range" min="1" max="4" step="1" value="1" aria-label="定态量子数 n"></div>
<script>
/* Local instance runtime: no fixed IDs, no external dependencies. */
(()=>{
const KIND='quantum-linked';
for(const root of document.querySelectorAll(`[data-sci-example="${KIND}"]`)){
if(root.dataset.mounted==='true')continue;
root.dataset.mounted='true';
const $=q=>root.querySelector(q), svg=$('svg'), range=$('input'), area=$('[data-controls]'), feedback=$('[data-feedback]');
const ns='http://www.w3.org/2000/svg', MAX=1000;
let value=1,batch=1,samples=[],timer=null,candidate=null,flashTimer=null,feedbackTimer=null;
function makeSamples(seed){let a=seed>>>0;const random=()=>{a=(Math.imul(1664525,a)+1013904223)>>>0;return a/4294967296};return Array.from({length:MAX},()=>{let x=-3;for(let j=0;j<6;j++)x+=random()<.5?1:0;return x})}
function stats(n){const bins=Array(7).fill(0);let sum=0,squares=0;for(let i=0;i<n;i++){const x=samples[i];bins[x+3]++;sum+=x;squares+=x*x}return{bins,mean:sum/n,sd:n>1?Math.sqrt(Math.max(0,(squares-sum*sum/n)/(n-1))):null}}
function el(tag,a={},text){const e=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e}
function label(x,y,t,anchor='start',extra={}){return el('text',{x,y,'text-anchor':anchor,fill:'var(--foreground)','font-size':18,...extra},t)}
function line(x1,y1,x2,y2,extra={}){return el('line',{x1,y1,x2,y2,stroke:'var(--border)',...extra})}
function draw(){
 const w=Math.max(280,svg.clientWidth||320), left=64,right=w-20;
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${KIND==='sampling-distribution'?310:410}`);
 if(KIND==='sampling-distribution'){
  const s=stats(value),top=40,bottom=235,bar=(right-left)/7, theory=[1,6,15,20,15,6,1].map(v=>v/64),Y=v=>bottom-v*(bottom-top);
  el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','data-chart-frame':''});
  label(left,23,'相对频率','start' ,{'data-axis':'y',class:'axis-title'});
  for(const v of [0,.5,1]){label(left-8,Y(v)+6,`${v*100}%`,'end');if(v===.5)line(left,Y(v),right,Y(v));}
  for(let i=0;i<7;i++){
   const cx=left+(i+.5)*bar,h=s.bins[i]/value*(bottom-top),bw=bar*.65;
   if(i===samples[value-1]+3)el('rect',{x:cx-bar*.48,y:top,width:bar*.96,height:bottom-top+32,fill:'var(--viz-series-1)',opacity:.12,'data-latest-bin':i-3});
   el('rect',{x:cx-bw/2,y:bottom-h,width:bw,height:h,fill:'var(--viz-series-1)'});
   line(cx-bar*.42,Y(theory[i]),cx+bar*.42,Y(theory[i]),{'stroke':'var(--foreground)','stroke-dasharray':'3 3','stroke-width':2});
   label(cx,259,String(i-3),'middle');
   
   const title=el('title',{},`误差 ${i-3} nm：${s.bins[i]} / ${value}，${(100*s.bins[i]/value).toFixed(1)}%`);title.dataset.bin=String(i);
  }
  label(right,294,'单次误差 / nm','end',{'data-axis':'x',class:'axis-title'});
  $('[data-value]').textContent=String(value);
  $('[data-reading]').textContent=`均值 ${s.mean.toFixed(3)} nm · 样本标准差 ${s.sd===null?'—':s.sd.toFixed(3)+' nm'}`;
  $('[data-latest]').textContent=`最新一次：${samples[value-1]>0?'+':''}${samples[value-1]} nm → 下方浅底栏`;
  root.dataset.mean=String(s.mean);root.dataset.bins=JSON.stringify(s.bins);root.dataset.batch=String(batch);
 }else{
  const top=40,bottom=190,Y=r=>bottom-r/2*(bottom-top),X=q=>left+q*(right-left);
  el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','data-chart-frame':''});
  label(left,23,'概率密度 × L', 'start',{'data-axis':'y',class:'axis-title'});
  for(const r of [0,1,2])label(left-8,Y(r)+6,String(r),'end');
  let d='';for(let i=0;i<=256;i++){const q=i/256,r=2*Math.sin(value*Math.PI*q)**2;d+=`${i?'L':'M'}${X(q).toFixed(2)},${Y(r).toFixed(2)} `}
  el('path',{d,fill:'none',stroke:'var(--viz-series-1)','stroke-width':2.5});
  for(const q of [0,.5,1])label(X(q),214,String(q),q===0?'start':q===1?'end':'middle');
  label(right,241,'位置 x / L','end',{'data-axis':'x',class:'axis-title'});
  // Energy ladder is a separate representation, not another spatial plot.
  const ey=e=>383-(e-1)/15*100;
  label(left,272,'能量 E / E₁');
  for(let n=1;n<=4;n++){const y=ey(n*n);line(left,y,right-60,y,{stroke:n===value?'var(--viz-series-1)':'var(--border)','stroke-width':n===value?3:1});label(left-8,y+5,String(n*n),'end');label(right,y+5,`n=${n}`,'end');if(n===value)el('circle',{cx:left+8,cy:y,r:4,fill:'var(--viz-series-1)'})}
  $('[data-value]').textContent=String(value);
  $('[data-reading]').textContent=`${value} 个概率峰 · 内部 ${value-1} 个节点 · 能量 ${value*value} E₁`;
  root.dataset.energy=String(value*value);
 }
 range.value=String(value);root.dataset.value=String(value);root.sciSync?.();
}
function stop(){if(timer!==null)clearInterval(timer);timer=null;root.dataset.running='false';root.sciSync?.();}
function setValue(v){if(!Number.isFinite(Number(v)))throw new TypeError('value must be finite');v=Number(v);value=Math.max(1,Math.min(KIND==='sampling-distribution'?MAX:4,Math.round(v)));draw()}
range.oninput=()=>{stop();setValue(+range.value)};
const transport={isPlaying:()=>timer!==null,toggle:()=>{if(timer!==null){stop();return}if(value===MAX)setValue(1);root.dataset.running='true';timer=setInterval(()=>{if(!root.isConnected||document.hidden){stop();return}setValue(Math.min(MAX,value+5));if(value===MAX){stop();setValue(1)}},40);root.sciSync?.();}};
if(KIND==='sampling-distribution')samples=makeSamples(batch);
const ro=new ResizeObserver(draw);ro.observe(svg);
SciControls.mount(root,{controls:[{key:'state',label:'量子态 n',input:root.querySelector('input'),defaultValue:1,kind:'wheel',discrete:true,stops:[1,2,3,4],period:4,unit:''}],pause:stop});
root.sciApi.setValue=v=>{stop();setValue(v)};
root.sciDestroy=()=>{root.sciDisposeControls();ro.disconnect();delete root.dataset.mounted;};
draw();
}
})();

</script>
</section>
