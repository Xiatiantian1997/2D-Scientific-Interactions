<section id="process-window">
<style>#process-window{overflow-anchor:none}#process-window .scene{display:block;width:100%;height:310px;touch-action:none}#process-window .scene text{fill:var(--foreground);font-size:12px}#process-window .reset-area{position:relative;isolation:isolate;padding:12px 8px 28px;min-height:160px}#process-window .reset-area::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--foreground);opacity:0;pointer-events:none;transition:opacity 160ms}#process-window .reset-area.flash::before{opacity:.07}#process-window .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}#process-window .reading{margin:0 0 10px;min-height:3em}#process-window .form-label{min-width:0}@media(max-width:360px){#process-window .fields{grid-template-columns:1fr;gap:4px}}@media(prefers-reduced-motion:reduce){#process-window .reset-area::before{transition:none}}</style>
<h3>工艺窗口 · 两项要求都要满足</h3>
<svg class="scene cursor-interaction" role="img" aria-label="拖动参数点。横轴温度偏移，纵轴流量偏移；填色区域同时满足厚度与不均匀度要求。"></svg>
<div class="viz-row text-small"><span><span style="color:var(--viz-series-1)">■</span> 同时合格</span><span><span style="color:var(--viz-series-2)">━</span> 厚度边界</span><span><span style="color:var(--viz-series-3)">┄</span> 不均匀度边界</span></div>
<div class="reset-area cursor-interaction" data-reset-area>
<div class="reading tabular-nums" aria-live="polite"><div data-thickness></div><div data-uniformity></div></div>
<div class="fields"><label class="form-label">温度偏移 <output data-x>0.00</output><input class="form-range" data-axis="x" type="range" min="-1" max="1" step="0.01" value="0" aria-label="归一化温度偏移"></label><label class="form-label">流量偏移 <output data-y>0.00</output><input class="form-range" data-axis="y" type="range" min="-1" max="1" step="0.01" value="0" aria-label="归一化流量偏移"></label></div>
<div class="text-small text-muted" data-feedback role="status">点这片空白复位 · 坐标为归一化值</div>
</div>
<script>
(()=>{const root=document.getElementById('process-window'),svg=root.querySelector('.scene'),ix=root.querySelector('[data-axis="x"]'),iy=root.querySelector('[data-axis="y"]');let x=0,y=0,active=null;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text,parent=svg){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e}function layout(){const w=svg.clientWidth||320;return{w,left:54,right:w-20,top:32,bottom:258}}function pos(a,b){const q=layout();return[q.left+(a+1)*(q.right-q.left)/2,q.bottom-(b+1)*(q.bottom-q.top)/2]}const limits=[[.3,.2,.1],[-.3,-.2,.1],[1,-1,1],[-1,1,1]];function clip(poly,a,b,c){const out=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],u=a*p[0]+b*p[1]-c,v=a*q[0]+b*q[1]-c;if(u<=1e-12)out.push(p);if((u<0&&v>0)||(u>0&&v<0)){const t=u/(u-v);out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}return out}
function background(){const q=layout();svg.setAttribute('viewBox',`0 0 ${q.w} 310`);svg.replaceChildren();let poly=[[-1,-1],[1,-1],[1,1],[-1,1]];for(const [a,b,c]of limits)poly=clip(poly,a,b,c);add('polygon',{points:poly.map(p=>pos(...p).join(',')).join(' '),fill:'var(--viz-series-1)',opacity:.19});add('rect',{x:q.left,y:q.top,width:q.right-q.left,height:q.bottom-q.top,fill:'none',stroke:'var(--border)','data-chart-frame':''});for(const v of [-1,0,1]){const [px,py]=pos(v,v);if(v===0){add('line',{x1:px,x2:px,y1:q.top,y2:q.bottom,stroke:'var(--border)'});add('line',{x1:q.left,x2:q.right,y1:py,y2:py,stroke:'var(--border)'})}add('text',{x:px,y:q.bottom+18,'text-anchor':v===-1?'start':v===1?'end':'middle'},v);add('text',{x:q.left-10,y:py+4,'text-anchor':'end'},v)}add('text',{x:q.left,y:18,class:'axis-title','data-axis':'y'},'流量偏移 / 归一化');add('text',{x:q.right,y:299,'text-anchor':'end',class:'axis-title','data-axis':'x'},'温度偏移 / 归一化');limits.forEach(([a,b,c],i)=>{const pts=[];for(const xx of [-1,1]){const yy=(c-a*xx)/b;if(Math.abs(yy)<=1+1e-9)pts.push([xx,yy])}for(const yy of [-1,1]){const xx=(c-b*yy)/a;if(Math.abs(xx)<=1+1e-9)pts.push([xx,yy])}const unique=pts.filter((p,i)=>!pts.slice(0,i).some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<1e-8));if(unique.length>=2){const p=pos(...unique[0]),q=pos(...unique[1]);add('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:i<2?'var(--viz-series-2)':'var(--viz-series-3)','stroke-width':2,'stroke-dasharray':i<2?'':'5 4'})}});add('g',{'data-probe':''});update()}
function update(){const h=1+.3*x+.2*y,u=.02+.03*(x-y)**2,okh=h>=.9-1e-10&&h<=1.1+1e-10,oku=u<=.05+1e-10,g=svg.querySelector('[data-probe]');if(!g)return;g.replaceChildren();const [px,py]=pos(x,y),[cx,cy]=pos(0,0);if(Math.hypot(x,y)>.05)add('circle',{cx,cy,r:5,fill:'none',stroke:'var(--muted-foreground)','stroke-dasharray':'3 2'},undefined,g);add('circle',{cx:px,cy:py,r:7,fill:'var(--foreground)',stroke:'var(--background)','stroke-width':2},undefined,g);ix.value=x;iy.value=y;root.querySelector('[data-x]').textContent=x.toFixed(2);root.querySelector('[data-y]').textContent=y.toFixed(2);root.querySelector('[data-thickness]').textContent=`厚度 ${h.toFixed(2)} ×目标 · ${okh?'合格':'超限'}（0.90–1.10）`;root.querySelector('[data-uniformity]').textContent=`不均匀度 ${(u*100).toFixed(1)}% · ${oku?'合格':'超限'}（≤5%）`;root.dataset.x=x;root.dataset.y=y;root.dataset.thickness=h;root.dataset.uniformity=u;root.dataset.feasible=String(okh&&oku)}
function move(e){const b=svg.getBoundingClientRect(),q=layout();x=Math.max(-1,Math.min(1,2*(e.clientX-b.left-q.left)/(q.right-q.left)-1));y=Math.max(-1,Math.min(1,1-2*(e.clientY-b.top-q.top)/(q.bottom-q.top)));update()}svg.onpointerdown=e=>{if(!e.isPrimary)return;const b=svg.getBoundingClientRect(),q=layout(),a=e.clientX-b.left,v=e.clientY-b.top;if(a<q.left||a>q.right||v<q.top||v>q.bottom)return;active=e.pointerId;svg.setPointerCapture(active);move(e)};svg.onpointermove=e=>{if(active===e.pointerId)move(e)};svg.onpointerup=svg.onpointercancel=svg.onlostpointercapture=()=>{active=null};ix.oninput=()=>{x=+ix.value;update()};iy.oninput=()=>{y=+iy.value;update()};function reset(){x=y=0;update()}
const feedback=root.querySelector('[data-feedback]'),area=root.querySelector('[data-reset-area]');let feedbackTimer,flashTimer,candidate=null;
function resetWithFeedback(){reset();clearTimeout(feedbackTimer);clearTimeout(flashTimer);area.classList.add('flash');feedback.textContent='已复位 ✓';flashTimer=setTimeout(()=>area.classList.remove('flash'),220);feedbackTimer=setTimeout(()=>{feedback.textContent='点这片空白复位'},650)}

area.onpointerdown=e=>{if(!e.isPrimary||e.button>0||e.target.closest('button,input,select,textarea,a')){candidate=null;return}candidate={id:e.pointerId,x:e.clientX,y:e.clientY,start:performance.now()};area.setPointerCapture(e.pointerId)};
area.onpointermove=e=>{if(candidate&&candidate.id===e.pointerId&&Math.hypot(e.clientX-candidate.x,e.clientY-candidate.y)>8)candidate=null};
area.onpointerup=e=>{const c=candidate;candidate=null;if(c&&c.id===e.pointerId&&performance.now()-c.start<500&&Math.hypot(e.clientX-c.x,e.clientY-c.y)<=8)resetWithFeedback()};
area.onpointercancel=area.onlostpointercapture=()=>{candidate=null};document.addEventListener('scroll',()=>{candidate=null},true);
root.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();resetWithFeedback()}});
new ResizeObserver(background).observe(svg);background();})();
</script>
</section>
