<section id="diffusion-exchange-plain">
<style>#diffusion-exchange-plain{overflow-anchor:none}#diffusion-exchange-plain .scene{display:block;width:100%;height:300px;touch-action:pan-y}#diffusion-exchange-plain .scene text{fill:var(--foreground);font-size:18px}#diffusion-exchange-plain .readout{min-height:2.8em;margin:8px 0}#diffusion-exchange-plain .time-row{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:12px}#diffusion-exchange-plain [hidden]{display:none}</style>
<h3>扩散 · 平衡了，还会交换吗？</h3>
<svg class="scene cursor-interaction" role="img" aria-label="左右等体积区域的双向交换。向右拖动推进时间，下方操作区空白可复位。"></svg>
<div data-readouts class="sci-readouts"><div class="readout" data-result aria-live="polite"></div><span data-time class="tabular-nums">0.00</span></div>
<div data-controls><input class="form-range" type="range" min="0" max="4" step="0.01" value="0" aria-label="观察时间"></div>
<script>
(()=>{const root=document.getElementById('diffusion-exchange-plain'),svg=root.querySelector('.scene'),range=root.querySelector('input'),transport={toggle:null,isPlaying:()=>running};let t=0,running=false,raf=0,last=0,drag=null;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e}function line(x1,y1,x2,y2,extra={}){return add('line',{x1,y1,x2,y2,stroke:'var(--border)','stroke-width':1,...extra})}function arrow(x,y,len,dir){const end=x+dir*len;line(x,y,end,y,{stroke:'var(--viz-series-1)','stroke-width':3});add('path',{d:`M ${end-dir*7} ${y-5} L ${end} ${y} L ${end-dir*7} ${y+5}`,fill:'none',stroke:'var(--viz-series-1)','stroke-width':2})}
function draw(){const w=svg.clientWidth||320;svg.setAttribute('viewBox',`0 0 ${w} 300`);svg.replaceChildren();const mid=w/2,bw=(w-72)/2,base=216,scale=1.7,left=50+30*Math.exp(-2*t),right=100-left;add('text',{x:16,y:22},'相同粒子 · 两区等体积');add('text',{x:16,y:55},`左区 ${left.toFixed(1)}`);add('text',{x:w-16,y:55,'text-anchor':'end'},`右区 ${right.toFixed(1)}`);for(const [x,n,initial]of [[16,left,80],[mid+20,right,20]]){add('rect',{x,y:base-initial*scale,width:bw,height:initial*scale,fill:'var(--viz-series-1)',opacity:.09});line(x,base-initial*scale,x+bw,base-initial*scale,{'stroke-dasharray':'4 4',stroke:'var(--muted-foreground)'});add('rect',{x,y:base-n*scale,width:bw,height:n*scale,fill:'var(--viz-series-1)',opacity:.40});line(x,base,x+bw,base)}line(mid,68,mid,220,{'stroke-dasharray':'3 5'});const maxLen=Math.min(105,w*.26);arrow(mid-maxLen/2,244,maxLen*left/100,1);arrow(mid+maxLen/2,276,maxLen*right/100,-1);add('text',{x:16,y:248},'左→右');add('text',{x:16,y:280},'右→左');add('text',{x:w-16,y:248,'text-anchor':'end'},left.toFixed(1));add('text',{x:w-16,y:280,'text-anchor':'end'},right.toFixed(1));root.querySelector('[data-time]').textContent=t.toFixed(2);range.value=t;root.querySelector('[data-result]').textContent=t>3?'净迁移接近零，双向交换仍在继续。':`净迁移向右：${(left-right).toFixed(1)} 单位 / τ`;svg.setAttribute('aria-label',`左区${left.toFixed(1)}，右区${right.toFixed(1)}；双向交换率分别为${left.toFixed(1)}和${right.toFixed(1)}单位每τ。`);root.dataset.total=(left+right).toFixed(6);root.dataset.time=t;root.dataset.running=running;root.sciSync?.();}
function stop(){running=false;cancelAnimationFrame(raf);root.dataset.running=false;root.sciSync?.();}function tick(now){if(!running)return;t=Math.min(4,t+(now-last)/1800);last=now;draw();if(t>=4){stop();t=0;draw();}else raf=requestAnimationFrame(tick)}transport.toggle=()=>{if(running){stop();return}if(t>=4)t=0;running=true;last=performance.now();raf=requestAnimationFrame(tick)};range.oninput=()=>{stop();t=+range.value;draw()};svg.onpointerdown=e=>{if(!e.isPrimary)return;stop();drag={id:e.pointerId,x:e.clientX,y:e.clientY,t,moved:false};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6)drag.moved=true;t=Math.max(0,Math.min(4,drag.t+dx/svg.clientWidth*4));draw()};svg.onpointerup=e=>{if(drag&&drag.id===e.pointerId)drag=null};svg.onpointercancel=svg.onlostpointercapture=()=>{drag=null};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(draw).observe(svg);draw();
SciControls.mount(root,{controls:[{key:'time',label:'观察时间',input:root.querySelector('input'),defaultValue:0,transport}],pause:()=>{stop();draw();},cancelGesture:()=>{drag=null;},transport,graph:root.querySelector('svg')});
})();
</script>
</section>
