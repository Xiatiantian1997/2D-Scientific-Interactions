<section id="complex-wave">
<style>
#complex-wave{color:var(--foreground);padding:8px 0}#complex-wave svg{width:100%;display:block}#complex-wave svg text{fill:var(--foreground);font-size:18px}#complex-wave .values{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px;margin:8px 0 16px}#complex-wave .swatch{width:20px;display:inline-block;vertical-align:middle;margin-right:6px;border-top:3px solid var(--viz-series-1)}#complex-wave .imag{border-top:3px dashed var(--viz-series-2)}#complex-wave .phase-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:12px 0}#complex-wave .range-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}#complex-wave .dial-hit{touch-action:none;cursor:grab}#complex-wave .dial-hit:active{cursor:grabbing}
</style>
<h3>一个复数，两个分量</h3>
<svg data-dial role="img" aria-label="单位圆上的复数箭头。横向投影是实部，纵向投影是虚部。拖动圆内可改变相位。"></svg>
<div class="values tabular-nums"><span><i class="swatch"></i>实部 a：<output data-real></output></span><span><i class="swatch imag"></i>虚部 b：<output data-imag></output></span></div>
<svg data-trace role="img" aria-label="相位从0度到360度，实部描出余弦，虚部描出正弦；标记对应上方箭头的当前相位。"></svg>
<div class="sci-controls" data-reset-area>
<div class="phase-row"><button class="btn" type="button" data-play>播放</button><div><div class="range-label"><label for="complex-phase">相位 θ</label><output data-angle>45°</output></div><input class="form-range" id="complex-phase" type="range" min="0" max="360" step="1" value="45"></div></div>
<div class="text-small" aria-live="polite" data-status>固定位置 · 箭头长度固定为 1</div>
<p class="text-small text-muted" data-feedback role="status">点操作区空白回到 45°</p></div>
<script>
(()=>{const root=document.getElementById('complex-wave'),dial=root.querySelector('[data-dial]'),plot=root.querySelector('[data-trace]'),range=root.querySelector('input'),play=root.querySelector('[data-play]'),real=root.querySelector('[data-real]'),imag=root.querySelector('[data-imag]'),angle=root.querySelector('[data-angle]');const NS='http://www.w3.org/2000/svg';let theta=45,running=false,last=0,visible=true,drag=null,cx=180,cy=139,r=90,w=360;let refs={};
function add(parent,tag,attrs,text){const n=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;parent.append(n);return n;}
function attr(n,a){Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));}
function number(v){return(Math.abs(v)<.0005?0:v).toFixed(2);}
function update(){const t=theta*Math.PI/180,a=Math.cos(t),b=Math.sin(t),x=cx+r*a,y=cy-r*b;attr(refs.x,{x2:x});attr(refs.y,{y2:y});attr(refs.project,{d:`M${x} ${cy} V${y} H${cx}`});attr(refs.arrow,{x2:x,y2:y});const backX=x-10*a,backY=y+10*b;attr(refs.head,{d:`M${backX-4*b} ${backY-4*a} L${x} ${y} L${backX+4*b} ${backY+4*a}`});attr(refs.tip,{cx:x,cy:y});const px=64+(w-82)*theta/360;attr(refs.guide,{x1:px,x2:px});attr(refs.realPoint,{cx:px,cy:99-48*a});attr(refs.imagPoint,{x:px-4,y:99-48*b-4});real.textContent=number(a);imag.textContent=number(b);angle.textContent=Math.round(theta)+'°';range.value=String(theta);SciControls.play(play,running);root.dataset.phase=theta.toFixed(3);root.dataset.real=a;root.dataset.imag=b;root.dataset.running=running;}
function draw(){w=Math.max(280,root.clientWidth);cx=w/2;cy=139;r=Math.min(94,(w-116)/2);dial.replaceChildren();plot.replaceChildren();dial.setAttribute('viewBox',`0 0 ${w} 275`);dial.style.height='275px';plot.setAttribute('viewBox',`0 0 ${w} 210`);plot.style.height='210px';
add(dial,'circle',{cx,cy,r,fill:'none',stroke:'var(--border)','stroke-width':1});add(dial,'line',{x1:cx-r-18,y1:cy,x2:cx+r+18,y2:cy,stroke:'var(--border)'});add(dial,'line',{x1:cx,y1:cy-r-16,x2:cx,y2:cy+r+15,stroke:'var(--border)'});
add(dial,'text',{x:cx,y:18,'text-anchor':'middle'},'虚轴 ↑');add(dial,'text',{x:w-8,y:cy-12,'text-anchor':'end'},'实轴 →');add(dial,'text',{x:cx-10,y:cy+17,'text-anchor':'end'},'0');add(dial,'text',{x:cx-r,y:cy+18,'text-anchor':'middle'},'−1');add(dial,'text',{x:cx+r,y:cy+18,'text-anchor':'middle'},'+1');add(dial,'text',{x:cx-10,y:cy-r+4,'text-anchor':'end'},'+1');add(dial,'text',{x:cx-10,y:cy+r+4,'text-anchor':'end'},'−1');
refs.project=add(dial,'path',{fill:'none',stroke:'var(--muted-foreground)','stroke-width':1,'stroke-dasharray':'3 4'});refs.x=add(dial,'line',{x1:cx,y1:cy,y2:cy,stroke:'var(--viz-series-1)','stroke-width':5,'stroke-linecap':'round'});refs.y=add(dial,'line',{x1:cx,y1:cy,x2:cx,stroke:'var(--viz-series-2)','stroke-width':5,'stroke-dasharray':'5 3','stroke-linecap':'round'});refs.arrow=add(dial,'line',{x1:cx,y1:cy,stroke:'var(--foreground)','stroke-width':2});refs.head=add(dial,'path',{fill:'none',stroke:'var(--foreground)','stroke-width':2});refs.tip=add(dial,'circle',{r:5,fill:'var(--foreground)'});
add(dial,'text',{x:cx,y:267,'text-anchor':'middle'},'拖动箭头看投影');const hit=add(dial,'circle',{cx,cy,r:r+18,fill:'transparent',class:'dial-hit'});hit.onpointerdown=e=>{if(!e.isPrimary)return;running=false;last=0;drag=e.pointerId;hit.setPointerCapture(e.pointerId);point(e);};hit.onpointermove=e=>{if(drag===e.pointerId)point(e);};const end=()=>{drag=null;};hit.onpointerup=end;hit.onpointercancel=end;hit.onlostpointercapture=end;
add(plot,'text',{x:64,y:17},'分量随相位变化');add(plot,'rect',{x:64,y:35,width:w-82,height:128,fill:'none',stroke:'var(--border)'});add(plot,'line',{x1:64,y1:99,x2:w-18,y2:99,stroke:'var(--border)'});add(plot,'text',{x:56,y:55,'text-anchor':'end'},'+1');add(plot,'text',{x:56,y:103,'text-anchor':'end'},'0');add(plot,'text',{x:56,y:151,'text-anchor':'end'},'−1');
for(const deg of [0,180,360])add(plot,'text',{x:64+(w-82)*deg/360,y:183,'text-anchor':deg===0?'start':deg===360?'end':'middle'},deg+'°');add(plot,'text',{x:w-18,y:205,'text-anchor':'end',class:'axis-title','data-axis':'x'},'相位 θ（度）');add(plot,'text',{x:10,y:32,class:'axis-title','data-axis':'y'},'分量');
for(const [fn,color,dash] of [[Math.cos,'var(--viz-series-1)',''],[Math.sin,'var(--viz-series-2)','6 4']]){let d='';for(let j=0;j<=180;j++){const t=j/180*2*Math.PI;d+=`${j?'L':'M'}${64+(w-82)*j/180} ${99-48*fn(t)} `;}add(plot,'path',{d,fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':dash});}
refs.guide=add(plot,'line',{y1:35,y2:163,stroke:'var(--muted-foreground)','stroke-width':1,'stroke-dasharray':'3 4'});refs.realPoint=add(plot,'circle',{r:4,fill:'var(--viz-series-1)'});refs.imagPoint=add(plot,'rect',{width:8,height:8,fill:'var(--viz-series-2)'});update();}
function point(e){const box=dial.getBoundingClientRect(),x=(e.clientX-box.left)*w/box.width-cx,y=cy-(e.clientY-box.top)*275/box.height;if(Math.hypot(x,y)<15)return;theta=(Math.atan2(y,x)*180/Math.PI+360)%360;update();}
range.oninput=()=>{running=false;last=0;theta=+range.value;update();};play.onclick=()=>{if(theta>=360)theta=0;running=!running;last=0;update();};new ResizeObserver(draw).observe(root);new IntersectionObserver(es=>{visible=es[0].isIntersecting;last=0;}).observe(root);document.addEventListener('visibilitychange',()=>last=0);function frame(t){if(!root.isConnected)return;if(running&&visible&&!document.hidden){if(last){theta=Math.min(360,theta+(t-last)*360/8000);if(theta>=360)running=false;update();}last=t;}else last=0;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);

SciControls.mount(root,{reset:()=>{running=false;last=0;theta=45;update();},pause:()=>{running=false;last=0;update();},cancelGesture:()=>{drag=null;}});
})();
</script>
</section>
