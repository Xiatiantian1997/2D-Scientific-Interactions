<section id="wafer-probe">
<style>#wafer-probe{overflow-anchor:none}#wafer-probe .scene{display:block;width:100%;height:330px;touch-action:pan-y}#wafer-probe .scene text{fill:var(--foreground);font-size:18px}#wafer-probe .reading{margin:0 0 12px;min-height:1.5em}</style>
<h3>晶圆测厚 · 测哪里，很重要</h3>
<svg class="scene cursor-interaction" role="img" aria-label="合成晶圆厚度分布，深色较厚。点按或拖动测点读取局部厚度，中心虚圈是初始测点。"></svg>
<div data-readouts class="sci-readouts"><div class="reading tabular-nums" data-result aria-live="polite"></div><output data-x>0 mm</output><output data-y>0 mm</output></div>
<div data-controls><input class="form-range" data-axis="x" type="range" min="-150" max="150" step="1" value="0" aria-label="横向测量位置"><input class="form-range" data-axis="y" type="range" min="-150" max="150" step="1" value="0" aria-label="纵向测量位置"></div>
<script>
(()=>{const root=document.getElementById('wafer-probe'),svg=root.querySelector('.scene'),ix=root.querySelector('[data-axis="x"]'),iy=root.querySelector('[data-axis="y"]');let x=0,y=0,active=null;const ns='http://www.w3.org/2000/svg',thickness=(a,b)=>100+18*Math.exp(-((a-.42)**2+(b+.25)**2)/.08)+4*(a*a+b*b);function add(tag,attrs,text,parent=svg){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e}function layout(){const w=svg.clientWidth||320;return{w,cx:w/2,cy:160,r:Math.min(122,(w-90)/2)}}
function background(){const{w,cx,cy,r}=layout();svg.setAttribute('viewBox',`0 0 ${w} 330`);svg.replaceChildren();const defs=add('defs',{}),clip=add('clipPath',{id:'wafer-probe-clip'},undefined,defs);add('circle',{cx,cy,r},undefined,clip);const g=add('g',{'clip-path':'url(#wafer-probe-clip)'});const n=80;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const a=-1+(i+.5)*2/n,b=1-(j+.5)*2/n;add('rect',{x:cx-r+i*2*r/n,y:cy-r+j*2*r/n,width:2*r/n,height:2*r/n,'shape-rendering':'crispEdges',fill:'var(--viz-series-1)',opacity:.12+.78*(thickness(a,b)-100)/22},undefined,g)}add('circle',{cx,cy,r,fill:'none',stroke:'var(--border)','stroke-width':1.5});add('text',{x:12,y:18},'300 mm 晶圆 · 示意数据');add('text',{x:cx,y:cy-r-6,'text-anchor':'middle'},'+y');add('text',{x:cx+r+10,y:cy+4},'+x');add('text',{x:12,y:294},'膜厚 / nm');const bx=95,bw=Math.max(100,w-115);for(let i=0;i<44;i++)add('rect',{x:bx+bw*i/44,y:283,width:bw/44+.2,height:10,fill:'var(--viz-series-1)',opacity:.12+.78*i/43});add('text',{x:bx,y:313},'100');add('text',{x:bx+bw,y:313,'text-anchor':'end'},'122');add('g',{'data-probe':''});update()}
function update(){const{cx,cy,r}=layout(),g=svg.querySelector('[data-probe]');if(!g)return;g.replaceChildren();if(Math.hypot(x,y)>.04)add('circle',{cx,cy,r:6,fill:'none',stroke:'var(--muted-foreground)','stroke-dasharray':'3 3'},undefined,g);const px=cx+x*r,py=cy-y*r;add('circle',{cx:px,cy:py,r:9,fill:'none',stroke:'var(--background)','stroke-width':5},undefined,g);add('circle',{cx:px,cy:py,r:9,fill:'none',stroke:'var(--foreground)','stroke-width':2},undefined,g);for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]])add('line',{x1:px+dx*11,y1:py+dy*11,x2:px+dx*16,y2:py+dy*16,stroke:'var(--foreground)'},undefined,g);const v=thickness(x,y),base=thickness(0,0);root.querySelector('[data-result]').textContent=`此处 ${v.toFixed(1)} nm · 中心 ${base.toFixed(1)} nm`;ix.value=Math.round(x*150);iy.value=Math.round(y*150);root.querySelector('[data-x]').textContent=Math.round(x*150)+' mm';root.querySelector('[data-y]').textContent=Math.round(y*150)+' mm';root.dataset.x=x;root.dataset.y=y;root.dataset.thickness=v;;root.sciSync?.();svg.setAttribute('aria-label',`当前位置x=${Math.round(x*150)}毫米，y=${Math.round(y*150)}毫米，膜厚${v.toFixed(1)}纳米；这是固定的合成数据。`)}
function move(e){const b=svg.getBoundingClientRect(),{cx,cy,r}=layout();let a=(e.clientX-b.left-cx)/r,v=(cy-e.clientY+b.top)/r;const d=Math.hypot(a,v);if(d>1){a/=d;v/=d}x=a;y=v;update()}svg.onpointerdown=e=>{if(!e.isPrimary)return;const b=svg.getBoundingClientRect(),q=layout();if(Math.hypot(e.clientX-b.left-q.cx,e.clientY-b.top-q.cy)>q.r+12)return;active=e.pointerId;svg.setPointerCapture(active);move(e)};svg.onpointermove=e=>{if(active===e.pointerId)move(e)};svg.onpointerup=svg.onpointercancel=svg.onlostpointercapture=()=>{active=null};ix.oninput=()=>{x=+ix.value/150;const bound=Math.sqrt(Math.max(0,1-x*x));y=Math.max(-bound,Math.min(bound,y));update()};iy.oninput=()=>{y=+iy.value/150;const bound=Math.sqrt(Math.max(0,1-y*y));x=Math.max(-bound,Math.min(bound,x));update()};
new ResizeObserver(background).observe(svg);background();
SciControls.mount(root,{controls:[{key:'x',label:'横向位置 / mm',input:root.querySelector('[data-axis="x"]'),defaultValue:0},{key:'y',label:'纵向位置 / mm',input:root.querySelector('[data-axis="y"]'),defaultValue:0}],pause:()=>{},cancelGesture:()=>{active=null;}});
})();
</script>
</section>
