<section id="wave-addition-area">
<style>#wave-addition-area{overflow-anchor:none}#wave-addition-area .scene{display:block;width:100%;height:340px;touch-action:pan-y}#wave-addition-area .scene text{fill:var(--foreground);font-size:12px}#wave-addition-area .reading{min-height:2.8em;margin:8px 0}#wave-addition-area .control-heading{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:8px;margin:0 0 4px}#wave-addition-area .reset-area{position:relative;isolation:isolate;padding:12px 12px 32px;min-height:160px;box-sizing:border-box}#wave-addition-area .reset-area::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--foreground);opacity:0;transition:opacity 160ms ease}#wave-addition-area .reset-area.flash::before{opacity:.07}@media(prefers-reduced-motion:reduce){#wave-addition-area .reset-area::before{transition:none}}</style>
<h3>干涉 · 把波峰推到波谷上</h3>
<svg class="scene cursor-interaction" role="img" aria-label="上方两列同幅同频的波，下方是逐点相加的结果。拖动上方曲线改变第二列波相位，点击下方操作区空白恢复同相。"></svg>
<div class="reset-area cursor-interaction" data-reset-area>
<div class="reading" data-result aria-live="polite"></div>
<div class="control-heading viz-row"><button class="btn btn-ghost" type="button" data-reset aria-label="相位差，点击恢复同相">相位差 <span class="tabular-nums" data-phase>0°</span></button><span class="text-small text-muted" data-feedback role="status">点这片空白复位</span></div>
<input class="form-range" type="range" min="0" max="360" step="1" value="0" aria-label="两列波相位差">
<div class="text-small text-muted">拖上图调整 · 虚线是原波基准</div>
</div>
<script>
(()=>{const root=document.getElementById('wave-addition-area'),svg=root.querySelector('.scene'),input=root.querySelector('input');let phase=0,drag=null;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e}function draw(){const w=svg.clientWidth||320,L=20,R=w-20,span=R-L;svg.setAttribute('viewBox',`0 0 ${w} 340`);svg.replaceChildren();const p=phase*Math.PI/180;function path(fn,cy,color,dash,opacity=1){let d='';for(let i=0;i<=180;i++){const x=L+span*i/180,y=cy-30*fn(4*Math.PI*i/180);d+=(i?' L ':'M ')+x.toFixed(2)+' '+y.toFixed(2)}add('path',{d,fill:'none',stroke:color,'stroke-width':2.5,'stroke-dasharray':dash||'',opacity})}add('text',{x:L,y:20},'两列原波 · 同一时刻');add('text',{x:L,y:46},'实线：波 1');add('text',{x:R,y:46,'text-anchor':'end'},'虚线：波 2');for(const cy of [103,260])add('line',{x1:L,x2:R,y1:cy,y2:cy,stroke:'var(--border)'});path(x=>Math.sin(x),103,'var(--viz-series-1)','');path(x=>Math.sin(x+p),103,'var(--viz-series-2)','6 4');add('text',{x:L,y:172},'逐点相加');path(x=>Math.sin(x),260,'var(--muted-foreground)','3 5',.5);path(x=>Math.sin(x)+Math.sin(x+p),260,'var(--viz-series-3)','');const u=Math.PI/2,x=L+span/8,a=Math.sin(u),b=Math.sin(u+p);add('line',{x1:x,x2:x,y1:62,y2:322,stroke:'var(--border)','stroke-dasharray':'3 5'});for(const [cy,v,c]of [[103,a,'var(--viz-series-1)'],[103,b,'var(--viz-series-2)'],[260,a+b,'var(--viz-series-3)']])add('circle',{cx:x,cy:cy-30*v,r:4,fill:c});add('text',{x:R,y:195,'text-anchor':'end'},`此处：${a.toFixed(1)} + (${b.toFixed(1)}) = ${(a+b).toFixed(1)}`);add('text',{x:R,y:337,'text-anchor':'end'},'沿传播方向的位置 →');input.value=phase;root.querySelector('[data-phase]').textContent=Math.round(phase)+'°';const amp=2*Math.abs(Math.cos(p/2));root.querySelector('[data-result]').textContent=amp<.02?'两列波处处反向，合成位移为零。':`合成振幅：原波的 ${amp.toFixed(2)} 倍`;root.dataset.phase=phase;root.dataset.amplitude=amp;svg.setAttribute('aria-label',`两列等幅波相位差${Math.round(phase)}度，合成振幅是单列波的${amp.toFixed(2)}倍。`)}function reset(){phase=0;draw()}input.oninput=()=>{phase=+input.value;draw()};svg.onpointerdown=e=>{if(!e.isPrimary)return;const b=svg.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,phase,upper:e.clientY-b.top<158,moved:false};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6)drag.moved=true;if(drag.upper){phase=((drag.phase-dx/(svg.clientWidth-40)*720)%360+360)%360;draw()}};svg.onpointerup=e=>{if(drag&&drag.id===e.pointerId)drag=null};svg.onpointercancel=svg.onlostpointercapture=()=>{drag=null};root.addEventListener('keydown',e=>{if(e.key==='r'&&!e.ctrlKey&&!e.metaKey)reset()});const resetButton=root.querySelector('[data-reset]'),feedback=root.querySelector('[data-feedback]'),area=root.querySelector('[data-reset-area]');let feedbackTimer,flashTimer,candidate=null;
function resetWithFeedback(){reset();clearTimeout(feedbackTimer);clearTimeout(flashTimer);area.classList.add('flash');feedback.textContent='已复位 ✓';flashTimer=setTimeout(()=>area.classList.remove('flash'),220);feedbackTimer=setTimeout(()=>{feedback.textContent='点这片空白复位'},650)}
resetButton.onclick=resetWithFeedback;
area.onpointerdown=e=>{if(!e.isPrimary||e.button>0||e.target.closest('button,input,select,textarea,a')){candidate=null;return}candidate={id:e.pointerId,x:e.clientX,y:e.clientY,start:performance.now()};area.setPointerCapture(e.pointerId)};
area.onpointermove=e=>{if(candidate&&candidate.id===e.pointerId&&Math.hypot(e.clientX-candidate.x,e.clientY-candidate.y)>8)candidate=null};
area.onpointerup=e=>{const c=candidate;candidate=null;if(c&&c.id===e.pointerId&&performance.now()-c.start<500&&Math.hypot(e.clientX-c.x,e.clientY-c.y)<=8)resetWithFeedback()};
area.onpointercancel=area.onlostpointercapture=()=>{candidate=null};document.addEventListener('scroll',()=>{candidate=null},true);
new ResizeObserver(draw).observe(svg);draw();})();
</script>
</section>
