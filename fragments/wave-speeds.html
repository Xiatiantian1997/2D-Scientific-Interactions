<section id="wave-speeds">
<style>
#wave-speeds{color:var(--foreground);padding:8px 0}#wave-speeds svg{width:100%;display:block}#wave-speeds svg text{fill:var(--foreground);font-size:18px}#wave-speeds [data-wave]{touch-action:pan-y;cursor:ew-resize}#wave-speeds .values{display:flex;flex-wrap:wrap;gap:10px 22px;margin:10px 0}#wave-speeds .swatch{display:inline-block;width:20px;vertical-align:middle;margin-right:6px;border-top:3px solid var(--viz-series-1)}#wave-speeds .group{border-top:3px dashed var(--viz-series-2)}#wave-speeds .row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:12px 0}#wave-speeds .label{display:flex;justify-content:space-between;gap:12px;margin:10px 0 6px}
</style>
<h3>波峰与波包，谁跑得快？</h3>

<svg data-wave role="img" aria-label="波包实部与包络。圆点跟踪中心载波的一个固定相位，方块跟踪包络中心。横拖回看时间。"></svg>
<div class="values tabular-nums"><span><i class="swatch"></i>圆点 · 相速度 <output data-vp></output></span><span><i class="swatch group"></i>方块 · 群速度 <output data-vg></output></span></div>

<svg data-dispersion role="img" aria-label="角频率对波数的色散关系。原点到当前点的连线斜率是相速度，当前点的切线斜率是群速度。"></svg>
<div class="values text-small"><span><i class="swatch"></i>原点连线 → 相速度</span><span><i class="swatch group"></i>切线 → 群速度</span></div>
<div class="sci-controls" data-reset-area>
<div class="viz-controls"><button type="button" class="btn" data-mode="free" aria-pressed="true">自由粒子</button><button type="button" class="btn" data-mode="linear" aria-pressed="false">无色散对照</button></div><div class="row"><button type="button" class="btn" data-play>播放</button><div><div class="label"><label for="speed-time">时间 / 横拖回看</label><output data-time></output></div><input class="form-range" id="speed-time" type="range" min="0" max="1000" value="0"></div></div><div class="label"><label for="speed-k">中心波数 k₀</label><output data-k></output></div><input class="form-range" id="speed-k" type="range" min="1.5" max="3" step=".1" value="2">
<div class="text-small" aria-live="polite" data-note></div>
<p class="text-small text-muted" data-feedback role="status">点操作区空白回到起始时间；保留模型与波数</p></div>
<script>
(()=>{const root=document.getElementById('wave-speeds'),wave=root.querySelector('[data-wave]'),disp=root.querySelector('[data-dispersion]'),timeRange=root.querySelector('#speed-time'),kRange=root.querySelector('#speed-k'),play=root.querySelector('[data-play]');const NS='http://www.w3.org/2000/svg';let k=2,t=0,mode='free',running=false,visible=true,last=0,drag=null;
function omega(x){return mode==='free'?x*x/2:x;}function speeds(){return{vp:omega(k)/k,vg:mode==='free'?k:1};}function env(x,v){return Math.exp(-((x-v*t)**2)/(2*3.2**2));}
function add(parent,tag,a,text){const n=document.createElementNS(NS,tag);Object.entries(a||{}).forEach(([key,val])=>n.setAttribute(key,val));if(text!==undefined)n.textContent=text;parent.append(n);return n;}
function path(parent,d,stroke,width=2,dash=''){return add(parent,'path',{d,fill:'none',stroke,'stroke-width':width,'stroke-dasharray':dash});}
function draw(){const w=Math.max(280,root.clientWidth),L=64,R=w-18,v=speeds(),sx=x=>L+(x+10)/32*(R-L),sy=y=>124-y*62;wave.replaceChildren();disp.replaceChildren();wave.setAttribute('viewBox',`0 0 ${w} 268`);wave.style.height='268px';disp.setAttribute('viewBox',`0 0 ${w} 240`);disp.style.height='240px';
add(wave,'text',{x:L,y:20,class:'axis-title','data-axis':'y'},'实部与包络');add(wave,'rect',{x:L,y:36,width:R-L,height:178,fill:'none',stroke:'var(--border)','data-chart-frame':''});add(wave,'line',{x1:L,y1:124,x2:R,y2:124,stroke:'var(--border)'});add(wave,'line',{x1:sx(0),y1:36,x2:sx(0),y2:214,stroke:'var(--border)','stroke-dasharray':'3 4'});
for(const y of [-1,0,1])add(wave,'text',{x:L-10,y:sy(y)+4,'text-anchor':'end'},y);for(const x of [0,10,20])add(wave,'text',{x:sx(x),y:234,'text-anchor':'middle'},x);add(wave,'text',{x:R,y:260,'text-anchor':'end',class:'axis-title','data-axis':'x'},'位置 x（示意单位）');
let upper='',lower='',carrier='';for(let j=0;j<=440;j++){const x=-10+32*j/440,A=env(x,v.vg),px=sx(x),pre=j?'L':'M';upper+=`${pre}${px} ${sy(A)} `;lower+=`${pre}${px} ${sy(-A)} `;carrier+=`${pre}${px} ${sy(A*Math.cos(k*x-omega(k)*t))} `;}
add(wave,'path',{d:upper+`L${R} ${sy(0)} L${L} ${sy(0)} Z`,fill:'var(--viz-series-2)',opacity:.09});path(wave,upper,'var(--viz-series-2)',2,'6 4');path(wave,lower,'var(--viz-series-2)',1,'6 4');path(wave,carrier,'var(--viz-series-1)',2);
const xp=v.vp*t,xg=v.vg*t;add(wave,'circle',{cx:sx(xp),cy:sy(env(xp,v.vg)),r:5,fill:'var(--viz-series-1)'});add(wave,'rect',{x:sx(xg)-4,y:sy(1)-4,width:8,height:8,fill:'var(--viz-series-2)'});
const px=x=>L+x/3.6*(R-L),py=y=>182-y/6.5*147;add(disp,'text',{x:L,y:19,class:'axis-title','data-axis':'y'},'角频率 ω');add(disp,'rect',{x:L,y:35,width:R-L,height:147,fill:'none',stroke:'var(--border)','data-chart-frame':''});let curve='';for(let j=0;j<=180;j++){const x=3.6*j/180;curve+=`${j?'L':'M'}${px(x)} ${py(omega(x))} `;}path(disp,curve,'var(--foreground)',1.6);path(disp,`M${px(0)} ${py(0)} L${px(k)} ${py(omega(k))}`,'var(--viz-series-1)',2.5);
const lo=Math.max(0,k-.65,k-omega(k)/v.vg),hi=Math.min(3.6,k+.65,k+(6.5-omega(k))/v.vg);path(disp,`M${px(lo)} ${py(omega(k)+v.vg*(lo-k))} L${px(hi)} ${py(omega(k)+v.vg*(hi-k))}`,'var(--viz-series-2)',3,'6 4');add(disp,'circle',{cx:px(k),cy:py(omega(k)),r:4,fill:'var(--foreground)'});path(disp,`M${px(k)} ${py(0)} V${py(omega(k))}`,'var(--border)',1,'3 4');
for(const x of [0,1,2,3])add(disp,'text',{x:px(x),y:204,'text-anchor':x===0?'start':'middle'},x);for(const y of [0,3,6])add(disp,'text',{x:L-10,y:py(y)+4,'text-anchor':'end'},y);add(disp,'text',{x:R,y:231,'text-anchor':'end',class:'axis-title','data-axis':'x'},'波数 k（示意单位）');
root.querySelector('[data-vp]').textContent=v.vp.toFixed(2);root.querySelector('[data-vg]').textContent=v.vg.toFixed(2);root.querySelector('[data-time]').textContent=t.toFixed(2);root.querySelector('[data-k]').textContent=k.toFixed(1);timeRange.value=Math.round(t/4*1000);SciControls.play(play,running);const note=mode==='free'?'窄带、短时近似 · 暂略波包展宽 · 群速度 = 2 × 相速度':'无色散参考 · 载波与包络同速';const n=root.querySelector('[data-note]');if(n.textContent!==note)n.textContent=note;root.dataset.time=t;root.dataset.vp=v.vp;root.dataset.vg=v.vg;root.dataset.phasePosition=xp;root.dataset.groupPosition=xg;root.dataset.running=running;}
function stop(){running=false;last=0;}timeRange.oninput=()=>{stop();t=+timeRange.value/1000*4;draw();};kRange.oninput=()=>{stop();k=+kRange.value;draw();};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{stop();mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));draw();});play.onclick=()=>{if(t>=4)t=0;running=!running;last=0;draw();};
wave.onpointerdown=e=>{if(!e.isPrimary)return;stop();drag={id:e.pointerId,x:e.clientX,t};wave.setPointerCapture(e.pointerId);draw();};wave.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;t=Math.max(0,Math.min(4,drag.t+4*(e.clientX-drag.x)/wave.getBoundingClientRect().width));draw();};const end=()=>drag=null;wave.onpointerup=end;wave.onpointercancel=end;wave.onlostpointercapture=end;
new ResizeObserver(draw).observe(root);new IntersectionObserver(es=>{visible=es[0].isIntersecting;last=0;}).observe(root);document.addEventListener('visibilitychange',()=>last=0);function frame(now){if(!root.isConnected)return;if(running&&visible&&!document.hidden){if(last){t=Math.min(4,t+(now-last)/1750);if(t>=4)running=false;draw();}last=now;}else last=0;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);

SciControls.mount(root,{reset:()=>{stop();t=0;draw();},pause:()=>{stop();draw();},cancelGesture:()=>{drag=null;}});
})();
</script>
</section>
