<section class="sci-extra" data-sci-example="sampling-distribution">
<style>
.sci-extra{overflow-anchor:none;color:var(--foreground)}.sci-extra svg{display:block;width:100%;overflow:visible}.sci-extra[data-sci-example="sampling-distribution"] svg{height:310px}.sci-extra[data-sci-example="quantum-linked"] svg{height:410px}.sci-extra [data-controls]{position:relative;isolation:isolate;padding:12px 4px 26px;min-height:150px}.sci-extra [data-controls]::before{content:"";position:absolute;inset:0;background:var(--foreground);opacity:0;z-index:-1;pointer-events:none;transition:opacity .16s}.sci-extra [data-controls].flash::before{opacity:.07}.sci-extra .transport{display:flex;gap:12px;align-items:center}.sci-extra .transport input{flex:1;min-width:0}.sci-extra .play-slot{flex:0 0 48px}.sci-extra [data-reading]{min-height:3em;margin:8px 0}.sci-extra [data-latest]{min-height:1.5em}.sci-extra [data-feedback]{margin-top:14px}.sci-extra input{width:100%}.sci-extra .batch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}@media(prefers-reduced-motion:reduce){.sci-extra [data-controls]::before{transition:none}}
</style>
<h3>随机采样 · 一次不确定，多次有分布</h3>
<div data-latest class="tabular-nums"></div>
<svg role="img" aria-label="离散误差的经验频率；固定虚线为总体理论频率，浅色底栏标记最新结果所属误差档。"></svg>
<div class="viz-row text-small"><span>实柱：本批样本</span><span>短虚线：总体规律</span></div>
<div data-controls>
<div data-reading class="tabular-nums" aria-live="polite"></div>
<div>样本量 <output data-value>1</output></div>
<div class="transport"><span class="play-slot"><button type="button" class="btn" data-play aria-label="开始积累样本" aria-pressed="false">▶</button></span><input type="range" class="form-range" min="1" max="1000" step="1" value="1" aria-label="样本量，拖动回看同一批样本"><button type="button" class="btn" data-step aria-label="增加一次采样">+1</button></div>
<div class="batch-row"><span class="text-small">固定总体 · 同批回看</span><button type="button" class="btn btn-ghost" data-batch>换一批</button></div>
<div data-feedback class="text-small" role="status">点操作区空白：回到同批第 1 项</div></div>
<script>
/* Local instance runtime: no fixed IDs, no external dependencies. */
(()=>{
const KIND='sampling-distribution';
for(const root of document.querySelectorAll(`[data-sci-example="${KIND}"]`)){
if(root.dataset.mounted==='true')continue;
root.dataset.mounted='true';
const $=q=>root.querySelector(q), svg=$('svg'), range=$('input'), area=$('[data-controls]'), feedback=$('[data-feedback]');
const ns='http://www.w3.org/2000/svg', MAX=1000;
let value=1,batch=1,samples=[],timer=null,candidate=null,flashTimer=null,feedbackTimer=null;
function makeSamples(seed){let a=seed>>>0;const random=()=>{a=(Math.imul(1664525,a)+1013904223)>>>0;return a/4294967296};return Array.from({length:MAX},()=>{let x=-3;for(let j=0;j<6;j++)x+=random()<.5?1:0;return x})}
function stats(n){const bins=Array(7).fill(0);let sum=0,squares=0;for(let i=0;i<n;i++){const x=samples[i];bins[x+3]++;sum+=x;squares+=x*x}return{bins,mean:sum/n,sd:n>1?Math.sqrt(Math.max(0,(squares-sum*sum/n)/(n-1))):null}}
function el(tag,a={},text){const e=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e}
function label(x,y,t,anchor='start',extra={}){return el('text',{x,y,'text-anchor':anchor,fill:'var(--foreground)','font-size':18,...extra},t)}
function line(x1,y1,x2,y2,extra={}){return el('line',{x1,y1,x2,y2,stroke:'var(--border)',...extra})}
function draw(){
 const w=Math.max(280,svg.clientWidth||320), left=64,right=w-20;
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${KIND==='sampling-distribution'?310:410}`);
 if(KIND==='sampling-distribution'){
  const s=stats(value),top=40,bottom=235,bar=(right-left)/7, theory=[1,6,15,20,15,6,1].map(v=>v/64),Y=v=>bottom-v*(bottom-top);
  el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','data-chart-frame':''});
  label(left,23,'相对频率','start' ,{'data-axis':'y',class:'axis-title'});
  for(const v of [0,.5,1]){label(left-8,Y(v)+6,`${v*100}%`,'end');if(v===.5)line(left,Y(v),right,Y(v));}
  for(let i=0;i<7;i++){
   const cx=left+(i+.5)*bar,h=s.bins[i]/value*(bottom-top),bw=bar*.65;
   if(i===samples[value-1]+3)el('rect',{x:cx-bar*.48,y:top,width:bar*.96,height:bottom-top+32,fill:'var(--viz-series-1)',opacity:.12,'data-latest-bin':i-3});
   el('rect',{x:cx-bw/2,y:bottom-h,width:bw,height:h,fill:'var(--viz-series-1)'});
   line(cx-bar*.42,Y(theory[i]),cx+bar*.42,Y(theory[i]),{'stroke':'var(--foreground)','stroke-dasharray':'3 3','stroke-width':2});
   label(cx,259,String(i-3),'middle');
   
   const title=el('title',{},`误差 ${i-3} nm：${s.bins[i]} / ${value}，${(100*s.bins[i]/value).toFixed(1)}%`);title.dataset.bin=String(i);
  }
  label(right,294,'单次误差 / nm','end',{'data-axis':'x',class:'axis-title'});
  $('[data-value]').textContent=String(value);
  $('[data-reading]').textContent=`均值 ${s.mean.toFixed(3)} nm · 样本标准差 ${s.sd===null?'—':s.sd.toFixed(3)+' nm'}`;
  $('[data-latest]').textContent=`最新一次：${samples[value-1]>0?'+':''}${samples[value-1]} nm → 下方浅底栏`;
  root.dataset.mean=String(s.mean);root.dataset.bins=JSON.stringify(s.bins);root.dataset.batch=String(batch);
 }else{
  const top=40,bottom=190,Y=r=>bottom-r/2*(bottom-top),X=q=>left+q*(right-left);
  el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--border)','data-chart-frame':''});
  label(left,23,'概率密度 × L', 'start',{'data-axis':'y',class:'axis-title'});
  for(const r of [0,1,2])label(left-8,Y(r)+6,String(r),'end');
  let d='';for(let i=0;i<=256;i++){const q=i/256,r=2*Math.sin(value*Math.PI*q)**2;d+=`${i?'L':'M'}${X(q).toFixed(2)},${Y(r).toFixed(2)} `}
  el('path',{d,fill:'none',stroke:'var(--viz-series-1)','stroke-width':2.5});
  for(const q of [0,.5,1])label(X(q),214,String(q),q===0?'start':q===1?'end':'middle');
  label(right,241,'位置 x / L','end',{'data-axis':'x',class:'axis-title'});
  // Energy ladder is a separate representation, not another spatial plot.
  const ey=e=>383-(e-1)/15*100;
  label(left,272,'能量 E / E₁');
  for(let n=1;n<=4;n++){const y=ey(n*n);line(left,y,right-60,y,{stroke:n===value?'var(--viz-series-1)':'var(--border)','stroke-width':n===value?3:1});label(left-8,y+5,String(n*n),'end');label(right,y+5,`n=${n}`,'end');if(n===value)el('circle',{cx:left+8,cy:y,r:4,fill:'var(--viz-series-1)'})}
  $('[data-value]').textContent=String(value);
  $('[data-reading]').textContent=`${value} 个概率峰 · 内部 ${value-1} 个节点 · 能量 ${value*value} E₁`;
  root.dataset.energy=String(value*value);
 }
 range.value=String(value);root.dataset.value=String(value);
}
function stop(){if(timer!==null)clearInterval(timer);timer=null;const b=$('[data-play]');if(b){b.textContent='▶';b.setAttribute('aria-label','开始积累样本');b.setAttribute('aria-pressed','false')}}
function setValue(v){if(!Number.isFinite(Number(v)))throw new TypeError('value must be finite');v=Number(v);value=Math.max(1,Math.min(KIND==='sampling-distribution'?MAX:4,Math.round(v)));draw()}
function reset(){stop();setValue(1);area.classList.add('flash');feedback.textContent='已复位 ✓';clearTimeout(flashTimer);clearTimeout(feedbackTimer);flashTimer=setTimeout(()=>area.classList.remove('flash'),200);feedbackTimer=setTimeout(()=>feedback.textContent=KIND==='sampling-distribution'?'点操作区空白：回到同批第 1 项':'点操作区空白：恢复 n=1',900)}
range.oninput=()=>{stop();setValue(+range.value)};
if(KIND==='sampling-distribution'){
 samples=makeSamples(batch);
 $('[data-batch]').onclick=()=>{stop();batch++;samples=makeSamples(batch);draw()};
 $('[data-step]').onclick=()=>{stop();setValue(value+1)};
 $('[data-play]').onclick=()=>{if(timer!==null){stop();return}if(value===MAX)setValue(1);const b=$('[data-play]');b.textContent='Ⅱ';b.setAttribute('aria-label','暂停积累样本');b.setAttribute('aria-pressed','true');timer=setInterval(()=>{if(!root.isConnected||document.hidden){stop();return}setValue(value+1);if(value===MAX)stop()},50)};
}
area.onpointerdown=e=>{if(!e.isPrimary||e.button>0||e.target.closest('button,input,label,select,textarea,a')){candidate=null;return}candidate={id:e.pointerId,x:e.clientX,y:e.clientY,start:performance.now()};};
area.onpointermove=e=>{if(candidate&&Math.hypot(e.clientX-candidate.x,e.clientY-candidate.y)>8)candidate=null};
area.onpointerup=e=>{const c=candidate;candidate=null;if(c&&c.id===e.pointerId&&performance.now()-c.start<500&&Math.hypot(e.clientX-c.x,e.clientY-c.y)<=8)reset()};
area.onpointercancel=area.onlostpointercapture=area.onpointerleave=()=>candidate=null;
root.onkeydown=e=>{if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();reset()}};
const onScroll=()=>candidate=null,onHidden=()=>{candidate=null;if(document.hidden)stop()};
document.addEventListener('scroll',onScroll,true);document.addEventListener('visibilitychange',onHidden);
const ro=new ResizeObserver(draw);ro.observe(svg);
root.sciApi={getState:()=>({value,batch}),setValue:v=>{stop();setValue(v)},reset};
root.sciDestroy=()=>{stop();ro.disconnect();clearTimeout(flashTimer);clearTimeout(feedbackTimer);document.removeEventListener('scroll',onScroll,true);document.removeEventListener('visibilitychange',onHidden);delete root.dataset.mounted;};
draw();
}
})();

</script>
</section>
