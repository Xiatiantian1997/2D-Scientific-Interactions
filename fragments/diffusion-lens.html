<section id="diffusion-stable">
<style>#diffusion-stable{overflow-anchor:none}#diffusion-stable .play-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr);align-items:center;gap:12px;margin:10px 0}#diffusion-stable .extra{display:block;margin:10px 0}#diffusion-stable [data-time]{display:inline-block;min-width:8ch;font-variant-numeric:tabular-nums}#diffusion-stable .scene{width:100%;height:360px;display:block;touch-action:pan-y}#diffusion-stable .scene text{font-size:12px;fill:var(--foreground)}#diffusion-stable .readout{margin:10px 0}</style>
<h3>每个粒子乱走，整体为什么散开？</h3>
<svg class="scene" role="img" aria-label="上方全体粒子，下方放大选中区域；拖动观察框，粒子身份不变。"></svg>
<div class="text-small">横拖框观察局部 · 轻点图内空白回到开始</div>
<div class="play-row"><div><button class="btn btn-block" type="button" data-play aria-pressed="false">播放</button></div><label class="form-label">进度 <output data-time></output><input class="form-range" data-time-input type="range" min="0" max="80" step=".1" value="0"></label></div><details class="extra"><summary>精细调节</summary><label class="form-label">观察位置<input class="form-range" data-lens type="range" min=".1" max=".9" step=".01" value=".5"></label></details>
<div class="readout text-small" data-status aria-live="polite"></div>
<script>
(()=>{const root=document.getElementById('diffusion-stable'),svg=root.querySelector('svg'),N=160,steps=80;let seed=193,t=0,lens=.5,playing=false,last=0,raf=0,drag=null,tap=null;const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};const reflect=x=>x<0?-x:x>1?2-x:x;const ys=Array.from({length:N},()=>random());const frames=[Array.from({length:N},()=>.44+.12*random())];for(let k=1;k<=steps;k++)frames.push(frames[k-1].map(x=>reflect(x+(random()<.5?-.023:.023))));
function add(tag,a,txt){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.append(e)}
function positions(){const k=Math.min(79,Math.floor(t)),f=t-k;return frames[k].map((x,i)=>x+(frames[k+1][i]-x)*f)}
function draw(){const w=Math.max(280,root.clientWidth),span=w-32,x=v=>16+span*v,p=positions();svg.setAttribute('viewBox',`0 0 ${w} 360`);svg.replaceChildren();add('text',{x:16,y:19},'全体 · 同一种粒子');add('rect',{x:16,y:34,width:span,height:106,fill:'var(--muted)'});add('rect',{x:x(.44),y:34,width:span*.12,height:106,fill:'var(--viz-series-1)',opacity:.12});p.forEach((v,i)=>add('circle',{cx:x(v),cy:44+ys[i]*84,r:2.8,fill:'var(--viz-series-1)'}));add('rect',{x:x(lens-.1),y:31,width:span*.2,height:112,fill:'none',stroke:'var(--foreground)','stroke-width':1.5});add('path',{d:`M${x(lens-.1)} 146 L16 215 M${x(lens+.1)} 146 L${w-16} 215`,stroke:'var(--border)',fill:'none'});add('text',{x:16,y:188},'选中区域放大 · 粒子一一对应');add('rect',{x:16,y:220,width:span,height:105,fill:'var(--muted)'});let count=0;p.forEach((v,i)=>{if(v>=lens-.1&&v<=lens+.1){count++;add('circle',{cx:16+((v-lens+.1)/.2)*(span-12)+6,cy:231+ys[i]*82,r:5,fill:'var(--viz-series-1)'});}});add('text',{x:16,y:350},`框内 ${count} 个 / 全体 ${N} 个`);root.querySelector('[data-time]').textContent=`${Math.round(t)} / 80 步`;root.querySelector('[data-time-input]').value=t;root.querySelector('[data-lens]').value=lens;root.dataset.count=N;root.dataset.time=t;root.querySelector('[data-play]').textContent=playing?'暂停':'播放';root.querySelector('[data-play]').setAttribute('aria-pressed',String(playing));}
function stop(){playing=false;cancelAnimationFrame(raf);draw()}function tick(now){if(!playing)return;if(last)t=Math.min(80,t+Math.min(60,now-last)*.006);last=now;draw();if(t<80)raf=requestAnimationFrame(tick);else{stop();root.querySelector('[data-status]').textContent='80 步结束：总数没变，分布已经散开。';}}
root.querySelector('[data-play]').onclick=()=>{if(playing){stop();return}if(t===80)t=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches){t=Math.min(80,t+10);draw();return}playing=true;last=0;raf=requestAnimationFrame(tick);draw()};function reset(){stop();t=0;lens=.5;draw();root.querySelector('[data-status]').textContent='已恢复初始分布与观察位置。'}root.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();reset()}});root.querySelector('[data-time-input]').oninput=e=>{stop();t=+e.target.value;draw()};root.querySelector('[data-lens]').oninput=e=>{lens=+e.target.value;draw()};svg.onpointerdown=e=>{if(!e.isPrimary){tap=null;drag=null;return;}const b=svg.getBoundingClientRect(),y=e.clientY-b.top;tap={id:e.pointerId,x:e.clientX,y:e.clientY,start:performance.now(),ok:(y<30||(y>146&&y<215)||y>330)};if(y>=30&&y<=146){drag=e.pointerId;svg.setPointerCapture(e.pointerId);move(e)}};function move(e){if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap.ok=false;if(drag!==e.pointerId)return;const b=svg.getBoundingClientRect();lens=Math.max(.1,Math.min(.9,(e.clientX-b.left-16)/(b.width-32)));draw()}svg.onpointermove=move;svg.onpointerup=e=>{if(tap&&tap.id===e.pointerId&&tap.ok&&performance.now()-tap.start<500)reset();tap=null;drag=null;};svg.onpointercancel=svg.onlostpointercapture=()=>{drag=null;tap=null;};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(draw).observe(root);root.querySelector('[data-status]').textContent='浅色带：初始聚集范围；框只观察，不影响运动。';draw();
})();
</script>
</section>
