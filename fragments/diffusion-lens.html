<section id="diffusion-symbols">
<style>#diffusion-symbols{overflow-anchor:none}#diffusion-symbols .extra{display:block;margin:10px 0}#diffusion-symbols [data-time]{display:inline-block;min-width:8ch;font-variant-numeric:tabular-nums}#diffusion-symbols .scene{width:100%;height:360px;display:block;touch-action:pan-y}#diffusion-symbols .scene text{font-size:18px;fill:var(--foreground)}#diffusion-symbols .readout{margin:10px 0}</style>
<h3>每个粒子乱走，整体为什么散开？</h3>
<svg class="scene" role="img" aria-label="上方全体粒子，下方放大选中区域；拖动观察框，粒子身份不变。"></svg>
<div class="text-small">横拖框观察局部 · 下方空白复位</div>
<div data-readouts class="sci-readouts"><output data-time></output><div class="readout text-small" data-status aria-live="polite"></div></div>
<div data-controls><input class="form-range" data-time-input type="range" min="0" max="80" step=".1" value="0"><input class="form-range" data-lens type="range" min=".1" max=".9" step=".01" value=".5"></div>
<script>
(()=>{const root=document.getElementById('diffusion-symbols'),svg=root.querySelector('svg'),N=160,steps=80;const transport={toggle:null,isPlaying:()=>playing};let seed=193,t=0,lens=.5,playing=false,last=0,raf=0,drag=null,tap=null;const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};const reflect=x=>x<0?-x:x>1?2-x:x;const ys=Array.from({length:N},()=>random());const frames=[Array.from({length:N},()=>.44+.12*random())];for(let k=1;k<=steps;k++)frames.push(frames[k-1].map(x=>reflect(x+(random()<.5?-.023:.023))));
function add(tag,a,txt){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.append(e)}
function positions(){const k=Math.min(79,Math.floor(t)),f=t-k;return frames[k].map((x,i)=>x+(frames[k+1][i]-x)*f)}
function draw(){const w=Math.max(280,root.clientWidth),span=w-32,x=v=>16+span*v,p=positions();svg.setAttribute('viewBox',`0 0 ${w} 360`);svg.replaceChildren();add('text',{x:16,y:19},'全体 · 同一种粒子');add('rect',{x:16,y:34,width:span,height:106,fill:'var(--muted)'});add('rect',{x:x(.44),y:34,width:span*.12,height:106,fill:'var(--viz-series-1)',opacity:.12});p.forEach((v,i)=>add('circle',{cx:x(v),cy:44+ys[i]*84,r:2.8,fill:'var(--viz-series-1)'}));add('rect',{x:x(lens-.1),y:31,width:span*.2,height:112,fill:'none',stroke:'var(--foreground)','stroke-width':1.5});add('path',{d:`M${x(lens-.1)} 146 L16 215 M${x(lens+.1)} 146 L${w-16} 215`,stroke:'var(--border)',fill:'none'});add('text',{x:16,y:188},'局部放大 · 同一批粒子');add('rect',{x:16,y:220,width:span,height:105,fill:'var(--muted)'});let count=0;p.forEach((v,i)=>{if(v>=lens-.1&&v<=lens+.1){count++;add('circle',{cx:16+((v-lens+.1)/.2)*(span-12)+6,cy:231+ys[i]*82,r:5,fill:'var(--viz-series-1)'});}});add('text',{x:16,y:350},`框内 ${count} 个 / 全体 ${N} 个`);root.querySelector('[data-time]').textContent=`${Math.round(t)} / 80 步`;root.querySelector('[data-time-input]').value=t;root.querySelector('[data-lens]').value=lens;root.dataset.count=N;root.dataset.time=t;;root.sciSync?.();}
function stop(){playing=false;cancelAnimationFrame(raf);draw()}function tick(now){if(!playing)return;if(last)t=Math.min(80,t+Math.min(60,now-last)*.006);last=now;draw();if(t<80)raf=requestAnimationFrame(tick);else{stop();t=0;draw();}}
transport.toggle=()=>{if(playing){stop();return}if(t===80)t=0;playing=true;last=0;raf=requestAnimationFrame(tick);draw()};root.querySelector('[data-time-input]').oninput=e=>{const value=+e.target.value;stop();t=value;draw()};root.querySelector('[data-lens]').oninput=e=>{lens=+e.target.value;draw()};svg.onpointerdown=e=>{if(!e.isPrimary){tap=null;drag=null;return;}const b=svg.getBoundingClientRect(),y=e.clientY-b.top;tap={id:e.pointerId,x:e.clientX,y:e.clientY,start:performance.now(),ok:(y<30||(y>146&&y<215)||y>330)};if(y>=30&&y<=146){drag=e.pointerId;svg.setPointerCapture(e.pointerId);move(e)}};function move(e){if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap.ok=false;if(drag!==e.pointerId)return;const b=svg.getBoundingClientRect();lens=Math.max(.1,Math.min(.9,(e.clientX-b.left-16)/(b.width-32)));draw()}svg.onpointermove=move;svg.onpointerup=e=>{tap=null;drag=null;};svg.onpointercancel=svg.onlostpointercapture=()=>{drag=null;tap=null;};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(draw).observe(root);root.querySelector('[data-status]').textContent='浅色带：初始聚集范围；框只观察，不影响运动。';draw();

SciControls.mount(root,{controls:[{key:'time',label:'扩散进度',input:root.querySelector('[data-time-input]'),defaultValue:0,transport},{key:'lens',label:'观察位置',input:root.querySelector('[data-lens]'),defaultValue:0.5}],pause:()=>{stop();},cancelGesture:()=>{drag=null;},transport,graph:root.querySelector('svg')});
})();
</script>
</section>
