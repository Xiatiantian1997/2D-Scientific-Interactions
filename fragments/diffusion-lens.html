<section id="diffusion-lens">
<style>#diffusion-lens .scene{width:100%;height:360px;display:block;touch-action:pan-y}#diffusion-lens .scene text{font-size:12px;fill:var(--foreground)}#diffusion-lens .readout{margin:10px 0}</style>
<h3>每个粒子乱走，整体为什么散开？</h3>
<div class="viz-controls"><button class="btn" type="button" data-play>播放扩散</button><button class="btn btn-ghost" type="button" data-back>回到开始</button></div>
<svg class="scene" role="img" aria-label="上方全体粒子，下方放大选中区域；拖动观察框，粒子身份不变。"></svg>
<div class="readout" data-status aria-live="polite"></div>
<label class="form-label">演化进度 <output data-time></output><input class="form-range" data-time-input type="range" min="0" max="80" step=".1" value="0"></label>
<label class="form-label">观察位置 · 也可横拖图中的框<input class="form-range" data-lens type="range" min=".1" max=".9" step=".01" value=".5"></label>
<script>
(()=>{const root=document.getElementById('diffusion-lens'),svg=root.querySelector('svg'),N=160,steps=80;let seed=193,t=0,lens=.5,playing=false,last=0,raf=0,drag=null;const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};const reflect=x=>x<0?-x:x>1?2-x:x;const ys=Array.from({length:N},()=>random());const frames=[Array.from({length:N},()=>.44+.12*random())];for(let k=1;k<=steps;k++)frames.push(frames[k-1].map(x=>reflect(x+(random()<.5?-.023:.023))));
function add(tag,a,txt){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.append(e)}
function positions(){const k=Math.min(79,Math.floor(t)),f=t-k;return frames[k].map((x,i)=>x+(frames[k+1][i]-x)*f)}
function draw(){const w=Math.max(280,root.clientWidth),span=w-32,x=v=>16+span*v,p=positions();svg.setAttribute('viewBox',`0 0 ${w} 360`);svg.replaceChildren();add('text',{x:16,y:19},'全体 · 同一种粒子');add('rect',{x:16,y:34,width:span,height:106,fill:'var(--muted)'});add('rect',{x:x(.44),y:34,width:span*.12,height:106,fill:'var(--viz-series-1)',opacity:.12});p.forEach((v,i)=>add('circle',{cx:x(v),cy:44+ys[i]*84,r:2.8,fill:'var(--viz-series-1)'}));add('rect',{x:x(lens-.1),y:31,width:span*.2,height:112,fill:'none',stroke:'var(--foreground)','stroke-width':1.5});add('path',{d:`M${x(lens-.1)} 146 L16 215 M${x(lens+.1)} 146 L${w-16} 215`,stroke:'var(--border)',fill:'none'});add('text',{x:16,y:188},'选中区域放大 · 粒子一一对应');add('rect',{x:16,y:220,width:span,height:105,fill:'var(--muted)'});let count=0;p.forEach((v,i)=>{if(v>=lens-.1&&v<=lens+.1){count++;add('circle',{cx:16+((v-lens+.1)/.2)*(span-12)+6,cy:231+ys[i]*82,r:5,fill:'var(--viz-series-1)'});}});add('text',{x:16,y:350},`框内 ${count} 个 / 全体 ${N} 个`);root.querySelector('[data-time]').textContent=`${Math.round(t)} / 80 步`;root.querySelector('[data-time-input]').value=t;root.querySelector('[data-lens]').value=lens;root.dataset.count=N;root.dataset.time=t;root.querySelector('[data-play]').textContent=playing?'暂停':'播放扩散';}
function stop(){playing=false;cancelAnimationFrame(raf);draw()}function tick(now){if(!playing)return;if(last)t=Math.min(80,t+Math.min(60,now-last)*.006);last=now;draw();if(t<80)raf=requestAnimationFrame(tick);else{stop();root.querySelector('[data-status]').textContent='80 步结束：总数没变，分布已经散开。';}}
root.querySelector('[data-play]').onclick=()=>{if(playing){stop();return}if(t===80)t=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches){t=Math.min(80,t+10);draw();return}playing=true;last=0;raf=requestAnimationFrame(tick);draw()};root.querySelector('[data-back]').onclick=()=>{stop();t=0;draw()};root.querySelector('[data-time-input]').oninput=e=>{stop();t=+e.target.value;draw()};root.querySelector('[data-lens]').oninput=e=>{lens=+e.target.value;draw()};svg.onpointerdown=e=>{if(!e.isPrimary)return;const b=svg.getBoundingClientRect();if(e.clientY-b.top>150)return;drag=e.pointerId;svg.setPointerCapture(e.pointerId);move(e)};function move(e){if(drag!==e.pointerId)return;const b=svg.getBoundingClientRect();lens=Math.max(.1,Math.min(.9,(e.clientX-b.left-16)/(b.width-32)));draw()}svg.onpointermove=move;svg.onpointerup=svg.onpointercancel=svg.onlostpointercapture=()=>drag=null;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(draw).observe(root);root.querySelector('[data-status]').textContent='浅色带：初始聚集范围；框只观察，不影响运动。';draw();
})();
</script>
</section>
