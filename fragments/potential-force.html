<section id="potential-force">
<style>
#potential-force{color:var(--foreground);padding:8px 0}#potential-force svg{width:100%;height:390px;display:block;touch-action:pan-y;cursor:ew-resize}#potential-force svg text{fill:var(--foreground);font-size:18px}#potential-force .values{display:flex;flex-wrap:wrap;gap:12px 20px;margin:12px 0}</style>
<h3>势能图往上走，力却往哪边？</h3>
<svg role="img" aria-label="上方是势能随位置的曲线，下方是真实直线轨道。同一个位置同时标出势能、切线和受力。横拖放置物体，然后释放。"></svg>
<div class="values tabular-nums"><span data-u></span><span data-f></span><span data-v></span></div>
<div data-readouts class="sci-readouts"><output data-x></output><div class="text-small" data-status aria-live="polite">已放置 · 速度为零</div></div>
<div data-controls><input id="potential-x" class="form-range" type="range" min="-2.5" max="2.5" step=".01" value="2"></div>
<script>
(()=>{const root=document.getElementById('potential-force'),svg=root.querySelector('svg'),range=root.querySelector('input'),transport={toggle:null,isPlaying:()=>running};const NS='http://www.w3.org/2000/svg';let x=2,v=0,A=2,time=0,started=false,running=false,last=0,visible=true,drag=null;
function add(tag,a,text){const n=document.createElementNS(NS,tag);Object.entries(a||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;svg.append(n);return n;}function line(x1,y1,x2,y2,color,width=1,dash=''){return add('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-dasharray':dash});}function fmt(n){return(Math.abs(n)<.0005?0:n).toFixed(2);}
function draw(){const w=Math.max(280,root.clientWidth),L=64,R=w-20,sx=z=>L+(z+3)/6*(R-L),sy=u=>214-u/5*160,U=.5*x*x,F=-x,px=sx(x);svg.setAttribute('viewBox',`0 0 ${w} 390`);svg.replaceChildren();add('text',{x:L,y:20},'势能随位置变化');add('text',{x:12,y:43,class:'axis-title','data-axis':'y'},'U（J）');add('rect',{x:L,y:44,width:R-L,height:170,fill:'none',stroke:'var(--border)','data-chart-frame':''});let d='';for(let j=0;j<=180;j++){const z=-3+6*j/180;d+=`${j?'L':'M'}${sx(z)} ${sy(.5*z*z)} `;}add('path',{d,fill:'none',stroke:'var(--foreground)','stroke-width':1.7});for(const z of [-2,0,2])add('text',{x:sx(z),y:233,'text-anchor':'middle'},z);for(const u of [0,2,4])add('text',{x:L-10,y:sy(u)+4,'text-anchor':'end'},u);add('text',{x:R,y:252,'text-anchor':'end',class:'axis-title','data-axis':'x'},'位置 x（m）');
// Local tangent, clipped analytically to U >= 0; it is not a path of motion.
const half=.5,lo=Math.max(-3,x-half),hi=Math.min(3,x+half);let a=lo,b=hi;if(x>0)a=Math.max(a,x-U/x);if(x<0)b=Math.min(b,x-U/x);line(sx(a),sy(U+x*(a-x)),sx(b),sy(U+x*(b-x)),'var(--viz-series-2)',3);line(px,sy(U),px,298,'var(--muted-foreground)',1,'3 4');add('circle',{cx:px,cy:sy(U),r:5,fill:'var(--viz-series-1)'});
add('text',{x:L,y:281},'实际直线轨道');line(L,300,R,300,'var(--muted-foreground)',1.5);for(const z of [-2,0,2]){line(sx(z),300,sx(z),305,'var(--muted-foreground)');add('text',{x:sx(z),y:322,'text-anchor':'middle'},z);}add('circle',{cx:px,cy:300,r:9,fill:'var(--viz-series-1)'});
const end=px+F*18;if(Math.abs(F)>.03){line(px,348,end,348,'var(--viz-series-2)',3);const dir=Math.sign(F);add('path',{d:`M${end-dir*8} 343 L${end} 348 L${end-dir*8} 353`,fill:'none',stroke:'var(--viz-series-2)','stroke-width':2});}add('text',{x:w/2,y:379,'text-anchor':'middle'},Math.abs(F)<.03?'斜率为零 → 合力为零':F<0?'右侧势能高 → 力向左':'左侧势能高 → 力向右');
root.querySelector('[data-u]').textContent='势能 '+fmt(U)+' J';root.querySelector('[data-f]').textContent='力 '+fmt(F)+' N';root.querySelector('[data-v]').textContent='速度 '+fmt(v)+' m/s';root.querySelector('[data-x]').textContent=fmt(A)+' m';range.value=A;const status=running?'自由运动中':started&&time<2*Math.PI?'已暂停 · 保留当前速度':time>=2*Math.PI?'一周期结束':'已放置 · 速度为零';const n=root.querySelector('[data-status]');if(n.textContent!==status)n.textContent=status;root.dataset.x=x;root.dataset.v=v;root.dataset.energy=.5*(x*x+v*v);root.dataset.running=running;;root.sciSync?.();}
function place(z){running=false;started=false;last=0;time=0;x=Math.max(-2.5,Math.min(2.5,z));A=x;v=0;draw();}range.oninput=()=>place(+range.value);transport.toggle=()=>{if(time>=2*Math.PI){time=0;x=A;v=0;}started=true;running=!running;last=0;draw();};svg.onpointerdown=e=>{if(!e.isPrimary)return;drag={id:e.pointerId,px:e.clientX,x};svg.setPointerCapture(e.pointerId);};svg.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;place(drag.x+(e.clientX-drag.px)*6/(svg.getBoundingClientRect().width-84));};const stopDrag=()=>drag=null;svg.onpointerup=stopDrag;svg.onpointercancel=stopDrag;svg.onlostpointercapture=stopDrag;
new ResizeObserver(draw).observe(root);new IntersectionObserver(es=>{visible=es[0].isIntersecting;last=0;}).observe(root);document.addEventListener('visibilitychange',()=>last=0);function frame(now){if(!root.isConnected)return;if(running&&visible&&!document.hidden){if(last){time=Math.min(2*Math.PI,time+(now-last)/1000);x=A*Math.cos(time);v=-A*Math.sin(time);if(time>=2*Math.PI){time=0;x=A;v=0;started=false;running=false;}draw();}last=now;}else last=0;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);

SciControls.mount(root,{controls:[{key:'position',label:'释放位置 / m',input:root.querySelector('input'),defaultValue:2},{key:'time',label:'运动时间 / s',min:0,max:2*Math.PI,step:.01,defaultValue:0,get:()=>time,set:value=>{running=false;last=0;time=value;started=time>0;x=A*Math.cos(time);v=-A*Math.sin(time);draw();},transport}],pause:()=>{running=false;last=0;draw();},cancelGesture:()=>{drag=null;},transport,graph:root.querySelector('svg')});
})();
</script>
</section>
